- request:
    method: OPTIONS
    url: /operacoes/bloqueio-cartoes
  response:
    status: 200
    headers:
      access-control-allow-origin: '*'
      access-control-allow-methods: '*'
      access-control-allow-headers: 'content-type, authorization, access_type'
      content-type: application/json

- request:
    method: POST
    url: /operacoes/bloqueio-cartoes
  response:
    status: 200
    latency: 0
    files: ['bloqueio-cartoes.json']
    headers:
      content-type: application/json
      access-control-allow-origin: '*'
