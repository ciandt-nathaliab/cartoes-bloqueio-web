<app-header></app-header>
<main class="conteudo">
  <section class="conteudo-principal" aria-labelledby="page-title">

    <div class="introducao">
      <p class="rotulo-secao">SEGURANÇA DO CARTÃO</p>
      <h1>Bloqueie seus cartões</h1>
      <p class="descricao">
        Selecione os cartões que deseja bloquear. Você pode escolher mais de um.
      </p>
    </div>

    <div class="cabecalho-lista">
      <h2>Seus cartões</h2>
    </div>

    <div class="acoes">
      <button
        class="botao-bloqueio"
        (click)="bloquearCartoes()"
      >
        Bloquear cartões
      </button>
    </div>
  </section>
</main>
