apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ${bamboo_pom_artifactId}-deployment
  namespace: $_KUBERNETES_NAMESPACE
  labels:
    app: ${bamboo_pom_artifactId}-deployment
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ${bamboo_pom_artifactId}-deployment
  minReplicas: $_KUBERNETES_MIN_REPLICAS
  maxReplicas: $_KUBERNETES_MAX_REPLICAS
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
