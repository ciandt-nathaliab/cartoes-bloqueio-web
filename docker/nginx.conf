worker_processes auto;
error_log /tmp/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /tmp/access.log  main;
    error_log   /tmp/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Temporary directories for kubernetes "readonlyfilesystem"
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    server {
        listen       8080 default_server;
        listen       [::]:8080 default_server;
        server_name  _;
        root /volume/opt/app-root/src;  # Diretório raiz correto
        error_log    /tmp/error.log warn;

        # Health check endpoints
        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "Healthy";
        }

        location /health/startup {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "Ready for startup";
        }

        location /health/ready {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "Ready for traffic";
        }

        location /healthz/ready {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "Ready for traffic";
        }

        # Configuração para o contexto específico do Angular
        location /cartoes-bloqueio-web/ {
            alias /volume/opt/app-root/src/;  # Aponta para o diretório raiz
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Configuração padrão
        location / {
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Localização específica para index.html para evitar loops
        location = /index.html {
            expires -1;
            add_header Cache-Control no-store;
        }

        error_page  405     =200 $uri;
    }
}
